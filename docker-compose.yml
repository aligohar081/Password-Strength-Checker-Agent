version: '3.8'

services:
  agent-api:
    build: .
    container_name: password-agent-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/password_checks.db
    volumes:
      - sqlite_data:/app/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local